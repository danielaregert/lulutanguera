<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrador — Shader tester</title>
    <style>
        html, body { margin: 0; height: 100%; background: #000; }
        #hero-shader {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
    </style>
</head>
<body>
    <canvas id="hero-shader"></canvas>

    <div id="shader-controls" style="position:fixed;left:1rem;bottom:1rem;z-index:100;display:flex;flex-direction:column;gap:.4rem;padding:.75rem .9rem;background:rgba(0,0,0,.8);color:#fff;font:12px/1.4 system-ui,sans-serif;border-radius:8px;">
        <strong style="font-size:11px;opacity:.6;">Shader &mdash; test</strong>
        <label style="display:flex;justify-content:space-between;align-items:center;gap:1rem;">Color A <input type="color" id="sh-color-a" value="#860d09"></label>
        <label style="display:flex;justify-content:space-between;align-items:center;gap:1rem;">Color B <input type="color" id="sh-color-b" value="#380200"></label>
        <label style="display:flex;justify-content:space-between;align-items:center;gap:1rem;">Trail (mouse) <input type="color" id="sh-trail" value="#000000"></label>
        <label style="display:flex;justify-content:space-between;align-items:center;gap:1rem;">Opacidad <input type="range" id="sh-opacity" min="0" max="1" step="0.05" value="0.35"></label>
        <label style="display:flex;justify-content:space-between;align-items:center;gap:1rem;">Blend
            <select id="sh-blend">
                <option value="screen">screen</option>
                <option value="overlay" selected>overlay</option>
                <option value="soft-light">soft-light</option>
                <option value="multiply">multiply</option>
                <option value="lighten">lighten</option>
                <option value="normal">normal</option>
            </select>
        </label>
        <label style="display:flex;justify-content:space-between;align-items:center;gap:1rem;">Efecto
            <select id="sh-mode">
                <option value="trail">1 &mdash; Trail</option>
                <option value="bulge">2 &mdash; Bulge</option>
                <option value="smoke">3 &mdash; SmokeFlow</option>
                <option value="ripples">4 &mdash; CursorRipples</option>
            </select>
        </label>
    </div>

    <script>
      window.process = window.process || { env: { NODE_ENV: "production" } };
    </script>

    <script type="module">
  import { createShader, isWebGPUSupported } from 'https://cdn.jsdelivr.net/npm/shaders@latest/dist/js/index.min.js';

  const canvas = document.getElementById('hero-shader');
  const controls = {
    colorA: document.getElementById('sh-color-a'),
    colorB: document.getElementById('sh-color-b'),
    trail: document.getElementById('sh-trail'),
    opacity: document.getElementById('sh-opacity'),
    blend: document.getElementById('sh-blend'),
  };
  const modeSel = document.getElementById('sh-mode');
  let shader = null;
  let mode = 'trail';

  const HERO_IMG = { type: 'ImageTexture', id: 'img', props: { url: 'lulublancoynegro.jpg', objectFit: 'cover' } };

  function presetFor(m) {
    if (m === 'bulge') {
      return {
        components: [
          {
            type: 'Bulge',
            id: 'bulge',
            props: { center: { type: 'mouse-position' }, strength: 0.6, radius: 0.45, falloff: 1, edges: 'mirror' },
            children: [structuredClone(HERO_IMG)],
          },
        ],
      };
    }
    if (m === 'smoke') {
      return { components: [{ type: 'SmokeFlow', id: 'smoke', props: { colorA: controls.colorA.value, colorB: controls.colorB.value } }] };
    }
    if (m === 'ripples') {
      return {
        components: [
          { type: 'CursorRipples', id: 'rip', props: {}, children: [structuredClone(HERO_IMG)] },
        ],
      };
    }
    return {
      components: [
        { type: 'LinearGradient', id: 'grad', props: { colorA: controls.colorA.value, colorB: controls.colorB.value } },
        { type: 'CursorTrail', id: 'trail', props: { colorA: controls.trail.value, colorB: controls.trail.value } },
      ],
    };
  }

  const MODE_STYLE = {
    trail: () => ({ opacity: controls.opacity.value, blend: controls.blend.value }),
    bulge: () => ({ opacity: '1', blend: 'normal' }),
    smoke: () => ({ opacity: '1', blend: 'screen' }),
    ripples: () => ({ opacity: '1', blend: 'normal' }),
  };

  function applyStyle() {
    const s = MODE_STYLE[mode]();
    canvas.style.opacity = s.opacity;
    canvas.style.mixBlendMode = s.blend;
  }

  function applyLive() {
    applyStyle();
    if (!shader) return;
    if (mode === 'trail') {
      shader.update('grad', { colorA: controls.colorA.value, colorB: controls.colorB.value });
      shader.update('trail', { colorA: controls.trail.value, colorB: controls.trail.value });
    } else if (mode === 'smoke') {
      shader.update('smoke', { colorA: controls.colorA.value, colorB: controls.colorB.value });
    }
  }

  [controls.colorA, controls.colorB, controls.trail, controls.opacity, controls.blend].forEach((el) =>
    el.addEventListener('input', applyLive)
  );

  async function mount() {
    if (!isWebGPUSupported()) {
      console.warn("[shader] WebGPU no soportado en este navegador");
      return;
    }
    if (shader) {
      shader.destroy();
      shader = null;
    }
    applyStyle();
    shader = await createShader(canvas, presetFor(mode));
    console.log("[shader] render OK (" + mode + ")");
  }

  modeSel.addEventListener('change', () => {
    mode = modeSel.value;
    mount().catch((e) => console.error("[shader] error:", e));
  });

  mount().catch((e) => console.error("[shader] error:", e));
    </script>
</body>
</html>
